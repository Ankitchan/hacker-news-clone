services:
  # PostgreSQL Database
  - type: pserv
    name: hackernews-db
    env: docker
    plan: free
    region: oregon
    databases:
      - name: hackernews_db
        databaseName: hackernews_clone
        user: postgres

  # Backend API
  - type: web
    name: hackernews-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: hackernews_db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hackernews_db
          property: port
      - key: DB_USER
        fromDatabase:
          name: hackernews_db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hackernews_db
          property: password
      - key: DB_NAME
        value: hackernews_clone
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: 72
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPAM_DETECTION_ENABLED
        value: true
      - key: HF_API_KEY
        sync: false
      - key: HF_SPAM_MODEL
        value: mrm8488/bert-tiny-finetuned-sms-spam-detection
    healthCheckPath: /api/posts

  # Frontend (Static Site)
  - type: web
    name: hackernews-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: hackernews-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: hackernews_db
    databaseName: hackernews_clone
    user: postgres
    plan: free
